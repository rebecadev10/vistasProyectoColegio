<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Colegio Manuel Díaz Rodríguez</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./public/css/base/base.css">
    <link rel="stylesheet" href="./public/css/general/formulario.css">
    <link rel="stylesheet" href="./public/css/general/autenticacion.css">
</head>

<body>
    <div class="contenedorAutenticacion">
        <div class="area1">
            <img src="./public/img/contenido/3.jpg" alt="Estudiantes del Colegio">
        </div>
        <div class="area2">
            <div class="formulario__card">
                <div class="logo">
                    <img src="./public/img/logos/logo.jpeg" alt="Logo Colegio Manuel Díaz Rodríguez">
                </div>
                <div class="formulario" style="width: 100%;">
                    <h2 class="formulario__titulo">Portal Académico</h2>

                    <form method="POST" id="frmAcceso">
                        <!-- Campo Cédula / Usuario -->
                        <div class="formulario__grupo">
                            <label for="nombreUsu" class="formulario__etiqueta">
                                <i class="fa-solid fa-id-card" style="color: var(--brand-primary);"></i> Cédula / Usuario:
                            </label>
                            <input type="text" id="nombreUsu" name="nombreUsu" class="formulario__input" placeholder="Ej: 29450555" required autocomplete="username">
                        </div>
                    
                        <!-- Campo Contraseña -->
                        <div class="formulario__grupo">
                            <label for="clave" class="formulario__etiqueta">
                                <i class="fa-solid fa-lock" style="color: var(--brand-primary);"></i> Contraseña:
                            </label>
                            <div class="password-wrapper">
                                <input type="password" id="clave" name="clave" class="formulario__input" placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="viewPassword" id="viewPassword" title="Mostrar/ocultar contraseña" aria-label="Mostrar/ocultar contraseña">
                                    <i class="fa-solid fa-eye ojo" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Botones y Enlaces -->
                        <div class="formulario__botones" style="flex-direction: column;">
                            <button type="submit" class="formulario__enviar">
                                <span>Ingresar al Portal</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                            <p class="btn-login">¿No tienes cuenta? <a href="./registroUsuario.php" class="link">Regístrate</a></p>
                            <p class="btn-login">¿Olvidaste tu contraseña? <a href="./recuperarClave.php" class="link">Recuperar</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script type="text/javascript" src="scripts/login.js"></script>
</body>
</html>
