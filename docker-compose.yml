version: '3.8'

services:
  web:
    build: .
    container_name: colegio_app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=colegio
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_PORT=3306
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.6
    container_name: colegio_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=colegio
    volumes:
      - mariadb_data:/var/lib/mysql
      - "./bd/colegio 13_04_2026.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: colegio_phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=rootpassword
    depends_on:
      - db
    restart: unless-stopped

volumes:
  mariadb_data:
